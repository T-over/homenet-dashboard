<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeNet Dashboard v2</title>
    <style>
        :root {
            --bg: #0f1117;
            --surface: #1a1d27;
            --surface2: #202430;
            --text: #e4e6eb;
            --muted: #8b92a4;
            --accent: #1e90ff;
            --green: #2ecc71;
            --red: #e74c3c;
            --orange: #f39c12;
            --border: rgba(255,255,255,0.1);
        }
        
        [data-theme="light"] {
            --bg: #f5f7fa;
            --surface: #ffffff;
            --surface2: #f0f2f5;
            --text: #1a1d27;
            --muted: #65676b;
            --border: rgba(0,0,0,0.1);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }
        
        .container { max-width: 1400px; margin: 0 auto; padding: 1rem; }
        
        header {
            background: var(--surface);
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        h1 { font-size: 1.8rem; font-weight: 600; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        
        .card {
            background: var(--surface);
            padding: 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
        }
        
        .card h3 { font-size: 0.875rem; color: var(--muted); margin-bottom: 0.5rem; text-transform: uppercase; }
        .card-value { font-size: 2rem; font-weight: 700; color: var(--accent); }
        
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 0.375rem;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background: var(--accent);
            color: white;
        }
        
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-sm { padding: 0.25rem 0.75rem; font-size: 0.8rem; }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: var(--surface2); font-weight: 600; }
        tr:hover { background: var(--surface2); }
        
        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge.online { background: var(--green); color: white; }
        .badge.offline { background: var(--red); color: white; }
        
        .loading { text-align: center; padding: 2rem; color: var(--muted); }
        .error { color: var(--red); padding: 1rem; }
        
        #devicesTable tbody {
            display: block;
            max-height: 500px;
            overflow-y: auto;
        }
        
        #devicesTable thead, #devicesTable tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏠 HomeNet Dashboard v2</h1>
            <div>
                <button class="btn" id="refreshBtn">🔄 Scan Réseau</button>
                <button class="btn" id="themeToggle">🌙</button>
            </div>
        </header>
        
        <div class="stats">
            <div class="card">
                <h3>Appareils en ligne</h3>
                <div class="card-value" id="onlineCount">0</div>
            </div>
            <div class="card">
                <h3>Download actuel</h3>
                <div class="card-value" id="downloadSpeed">— Mbps</div>
                <button class="btn btn-sm" id="runSpeedtestBtn">▶ Lancer</button>
            </div>
            <div class="card">
                <h3>Upload actuel</h3>
                <div class="card-value" id="uploadSpeed">— Mbps</div>
            </div>
            <div class="card">
                <h3>CVEs critiques</h3>
                <div class="card-value" id="cveCount">0</div>
            </div>
        </div>
        
        <div class="card">
            <h3>📡 Carte réseau</h3>
            <input type="text" id="filterInput" placeholder="Filtrer par IP ou nom..." style="width:100%;padding:0.5rem;margin:1rem 0;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:0.375rem;">
            <button class="btn btn-sm" id="exportCsv">📥 Export CSV</button>
            <table id="devicesTable">
                <thead>
                    <tr>
                        <th>IP</th>
                        <th>Nom personnalisé</th>
                        <th>Hostname</th>
                        <th>Fabricant</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="devicesTableBody">
                    <tr><td colspan="6" class="loading">Chargement...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <script>
        const API_BASE = '';
        const qs = (s) => document.querySelector(s);
        const qsa = (s) => document.querySelectorAll(s);
        
        async function fetchJSON(url, options = {}) {
            const res = await fetch(API_BASE + url, options);
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return res.json();
        }
        
        async function loadDevices() {
            try {
                const data = await fetchJSON('/api/devices');
                qs('#onlineCount').textContent = data.online_count || 0;
                
                const tbody = qs('#devicesTableBody');
                if (!data.devices || data.devices.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="loading">Aucun appareil détecté</td></tr>';
                    return;
                }
                
                tbody.innerHTML = data.devices.map(dev => `
                    <tr>
                        <td>${dev.ip}</td>
                        <td>${dev.alias || '—'}</td>
                        <td>${dev.hostname || '—'}</td>
                        <td>${dev.vendor || 'Inconnu'}</td>
                        <td><span class="badge ${dev.is_online ? 'online' : 'offline'}">${dev.is_online ? 'EN LIGNE' : 'HORS LIGNE'}</span></td>
                        <td><button class="btn btn-sm" onclick="scanCveForDevice('${dev.ip}', '${dev.hostname || dev.ip}')">🛡️ Scan CVE</button></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Erreur loadDevices:', err);
                qs('#devicesTableBody').innerHTML = '<tr><td colspan="6" class="error">Erreur de chargement</td></tr>';
            }
        }
        
        async function loadSpeedtest() {
            try {
                const data = await fetchJSON('/api/speedtest?limit=1');
                if (data.history && data.history.length > 0) {
                    const latest = data.history[0];
                    qs('#downloadSpeed').textContent = latest.download_mbps ? latest.download_mbps.toFixed(2) + ' Mbps' : '— Mbps';
                    qs('#uploadSpeed').textContent = latest.upload_mbps ? latest.upload_mbps.toFixed(2) + ' Mbps' : '— Mbps';
                }
            } catch (err) {
                console.error('Erreur loadSpeedtest:', err);
            }
        }
        
        async function runNetworkScan() {
            const btn = qs('#refreshBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Scan...';
            try {
                await fetchJSON('/api/scan/run', { method: 'POST' });
                await loadDevices();
                alert('✅ Scan réseau terminé!');
            } catch (err) {
                alert('❌ Erreur lors du scan');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 Scan Réseau';
            }
        }
        
        async function runSpeedtest() {
            const btn = qs('#runSpeedtestBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Test...';
            try {
                await fetchJSON('/api/speedtest/run', { method: 'POST' });
                await new Promise(r => setTimeout(r, 3000));
                await loadSpeedtest();
                alert('✅ Speedtest terminé!');
            } catch (err) {
                alert('❌ Impossible de lancer le speedtest');
            } finally {
                btn.disabled = false;
                btn.textContent = '▶ Lancer';
            }
        }
        
        async function scanCveForDevice(ip, hostname) {
            try {
                const data = await fetchJSON(`/api/cve/${hostname}?device_ip=${ip}`);
                if (data.vulnerabilities && data.vulnerabilities.length > 0) {
                    alert(`✅ ${data.vulnerabilities.length} CVE(s) trouvée(s) pour ${hostname}\n\nPremières CVEs:\n` + 
                          data.vulnerabilities.slice(0, 3).map(c => `• ${c.id}: ${c.severity || 'N/A'}`).join('\n'));
                } else {
                    alert(`ℹ️ Aucune CVE trouvée pour ${hostname}`);
                }
            } catch (err) {
                console.error('Erreur scan CVE:', err);
                alert('❌ Erreur lors du scan CVE');
            }
        }
        
        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            qs('#themeToggle').textContent = current === 'dark' ? '☀️' : '🌙';
        }
        
        function exportCsv() {
            const devices = Array.from(qsa('#devicesTableBody tr')).map(tr => {
                const tds = tr.querySelectorAll('td');
                return Array.from(tds).slice(0, 5).map(td => td.textContent).join(',');
            });
            const csv = 'IP,Nom,Hostname,Fabricant,Statut\n' + devices.join('\n');
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'homenet_devices.csv';
            a.click();
        }
        
        async function init() {
            await Promise.all([loadDevices(), loadSpeedtest()]);
            qs('#refreshBtn').addEventListener('click', runNetworkScan);
            qs('#runSpeedtestBtn').addEventListener('click', runSpeedtest);
            qs('#themeToggle').addEventListener('click', toggleTheme);
            qs('#exportCsv').addEventListener('click', exportCsv);
            
            qs('#filterInput').addEventListener('input', (e) => {
                const filter = e.target.value.toLowerCase();
                qsa('#devicesTableBody tr').forEach(tr => {
                    const text = tr.textContent.toLowerCase();
                    tr.style.display = text.includes(filter) ? '' : 'none';
                });
            });
            
            setInterval(() => { loadDevices(); loadSpeedtest(); }, 30000);
        }
        
        init();
    </script>
</body>
</html>
